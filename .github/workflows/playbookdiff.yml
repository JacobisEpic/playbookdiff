name: PlaybookDiff

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: playbookdiff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playbookdiff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Deliberately uses the Action from this checkout (`./`, where action.yml
      # lives) rather than the published `JacobisEpic/playbookdiff@v0`.
      #
      # `@v0` would test the last release; `./` tests the Action as this pull
      # request leaves it, including an unbuilt bundle or a regression in the
      # engine the Action wraps. Dogfooding is worth more when it exercises the
      # candidate rather than the artifact that already shipped.
      #
      # External consumers should use `JacobisEpic/playbookdiff@v0`; see
      # docs/github-action.md.
      - name: Compare effective configuration
        uses: ./
